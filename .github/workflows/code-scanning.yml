name: Code Scanning
on: [push]
jobs:
  golangci-lint-code-scanning:
    name: Code Scanning with errorformat / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - run: go install ./cmd/errorformat/
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15
          install-only: true
      - run: golangci-lint run --output.text.path=stdout --output.text.print-issued-lines=false --show-stats=false | errorformat -name=golangci-lint -w=sarif > results.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3.28.12
        with:
          sarif_file: results.sarif
